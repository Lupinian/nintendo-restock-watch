
name: Nintendo Store Stock Watch

on:
  schedule:
    # JST 06:45, 06:55
    - cron: '45,55 21 * * *'
    # JST 07:05 - 08:55
    - cron: '5,15,25,35,45,55 22-23 * * *'
    # JST 09:05 - 22:55
    - cron: '5,15,25,35,45,55 0-13 * * *'
    # JST 23:05 - 23:45
    - cron: '5,15,25,35,45 14 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nintendo-stock-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check product stock
        run: python stock_watch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Save stock state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain -- stock_state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
            git add stock_state.json
            git commit -m "Update stock state"
            git push
          fi
